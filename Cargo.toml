[package]
name = "rusty_expressions"
version = "0.2.0"
edition = "2021"
# The DEFAULT build's floor, which is what `cargo add rusty_expressions` gets:
# the `rusty-alloc` default feature pulls in `rusty_alloc-api`, which is
# edition 2024 and so needs 1.85. Cargo has one rust-version per package and
# enforces it on consumers, so it has to describe the default.
#
# The engine itself is far more conservative: `default-features = false`,
# with or without `compat`, builds on 1.73. Verified against that toolchain,
# not assumed.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Remade-With-Rust/rusty_expressions"
homepage = "https://www.mata.network/"
authors = ["Remade With Rust / Mata Network"]
readme = "README.md"
documentation = "https://docs.rs/rusty_expressions"
description = "Oniguruma remade in pure Rust: named groups, look-around, backreferences, subexp calls, absent expressions, callouts, per-regex encodings (UTF-8/16/32, Shift_JIS, Big5, EUC-*, GB18030, ISO-8859-*) and Perl/Python/Java/POSIX/GNU/Emacs/grep syntax dialects. Match-equivalent to Oniguruma 6.9.10 and ~3x faster than libonig. no_std + alloc with default-features = false, runs on wasm32, no C toolchain."
keywords = ["regex", "oniguruma", "regexp", "unicode", "no-std"]
categories = ["text-processing", "no-std", "encoding", "parser-implementations"]
exclude = ["tools/*", "docs/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rusty-alloc"]
# Install rusty_alloc as the process-wide allocator. A library that declares its
# own `#[global_allocator]` must build with `default-features = false`.
rusty-alloc = ["dep:rusty_alloc-api"]
# Guard pages + encrypted free lists in the allocator.
secure = ["rusty-alloc", "rusty_alloc-api/secure"]
# Oniguruma-shaped C ABI (`onig_new` / `onig_search` / `OnigRegion`) in pure
# Rust. No libonig, no C toolchain.
compat = []
# Deterministic VM work counters, for the benchmark harness. Not for shipping.
expr-count = []

[dependencies]
# Optional so `default-features = false` removes it from the graph entirely.
rusty_alloc-api = { version = "=1.1.4", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
