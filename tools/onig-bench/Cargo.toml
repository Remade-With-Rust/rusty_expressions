[package]
name = "onig-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dev-only rusty_expressions vs Oniguruma harness. Not a dependency of the crate."

[features]
default = ["rusty-alloc"]
# Links crates.io `onig` (libonig via onig_sys). Needs a C toolchain. Never
# enable this on the shipping thoth crate.
oracle = ["dep:onig", "dep:onig_sys"]
# Deterministic VM work counters.
count = ["rusty_expressions/expr-count"]
# The Oniguruma-shaped C ABI, so `--example fuzz_compat` can hammer it.
compat = ["rusty_expressions/compat"]
# Install rusty_alloc as the global allocator, as a deliverable would.
# Only affects our arm: libonig allocates through the C runtime.
rusty-alloc = ["rusty_expressions/rusty-alloc"]

[dependencies]
rusty_expressions = { path = "../..", default-features = false }
onig = { version = "6.4.0", optional = true, default-features = false }
# Raw encoding statics (OnigEncodingSJIS etc.) for the encoding oracle.
onig_sys = { version = "69", optional = true }
